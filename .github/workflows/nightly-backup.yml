name: nightly-backup
on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2:00 AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Backup Database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase db dump --project-ref $PROJECT_ID -f backup.sql
          # Encrypt backup
          echo "${{ secrets.ENCRYPTION_KEY }}" | gpg --batch --yes --passphrase-fd 0 -c backup.sql

      - name: Upload to Cloud Storage (Example)
        run: |
          # Add upload logic (e.g., AWS S3, R2)
          echo "Uploading backup.sql.gpg to storage..."
